<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Fang the Fox · Game Boy Color</title>
<style>
  :root { --bg: #0b0d1a; --panel: #141833; --edge: #2c3560; --text: #eef4ff; --dim: #8a98c8; --accent: #f59a3e; --screen: #000; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  h1 span { color: var(--dim); font-weight: 400; }
  .bezel { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px 10px 34px 10px; padding: 14px 14px 18px; }
  #screen { display: block; width: 480px; height: 432px; background: var(--screen); image-rendering: pixelated; image-rendering: crisp-edges; }
  #screen.fresh { animation: fresh .6s ease-out; }
  @keyframes fresh { from { outline: 3px solid var(--accent); outline-offset: 3px; } to { outline: 3px solid transparent; outline-offset: 3px; } }
  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; max-width: 720px; color: var(--dim); font-size: 13px; text-align: center; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  kbd { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); background: var(--panel); border: 1px solid var(--edge); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
  #status { min-height: 1.45em; }
  #pad { display: none; width: min(100%, 420px); height: 190px; position: relative; touch-action: none; }
  body.touch #pad { display: block; }
  body.touch .keys { display: none; }
  #dpad { position: absolute; left: 8px; top: 18px; width: 150px; height: 150px; }
  #dpad::before, #dpad::after { content: ""; position: absolute; background: #1f2440; border: 1px solid var(--edge); border-radius: 8px; }
  #dpad::before { left: 50px; top: 0; width: 50px; height: 150px; }
  #dpad::after { left: 0; top: 50px; width: 150px; height: 50px; }
  .round { position: absolute; width: 66px; height: 66px; border-radius: 50%; background: #7a1f24; border: 1px solid #c8332b; color: var(--text); display: grid; place-items: center; font-weight: 700; }
  .round[data-btn="A"] { right: 8px; top: 28px; }
  .round[data-btn="B"] { right: 88px; top: 70px; }
  .pill { position: absolute; bottom: 0; width: 72px; height: 26px; border-radius: 13px; background: #1f2440; border: 1px solid var(--edge); color: var(--dim); font-size: 11px; display: grid; place-items: center; letter-spacing: .06em; }
  .pill[data-btn="select"] { left: calc(50% - 80px); }
  .pill[data-btn="start"] { left: calc(50% + 8px); }
  .down { filter: brightness(1.5); }
  @media (max-width: 520px) { .bezel { padding: 8px 8px 14px; border-radius: 8px 8px 24px 8px; } }
</style>
</head>
<body>
  <h1>Fang the Fox <span>· Game Boy Color edition, in development</span></h1>
  <div class="bezel"><canvas id="screen" width="160" height="144" aria-label="Game screen"></canvas></div>
  <div id="pad" aria-hidden="true">
    <div id="dpad"></div>
    <div class="round" data-btn="B">B</div>
    <div class="round" data-btn="A">A</div>
    <div class="pill" data-btn="select">SELECT</div>
    <div class="pill" data-btn="start">START</div>
  </div>
  <div class="bar" id="status">Loading…</div>
  <div class="bar keys"><span><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> move</span><span><kbd>X</kbd> A</span><span><kbd>Z</kbd> B</span><span><kbd>Enter</kbd> Start</span><span><kbd>Shift</kbd> Select</span><span>hold <kbd>F</kbd> fast</span><span>controllers work too</span></div>
  <div class="bar"><button id="reset" type="button">Restart</button><button id="mute" type="button" aria-pressed="false">Sound on</button><button id="clear" type="button">Delete save</button></div>
  <script src="vendor/binjgb.js"></script>
  <script src="player.js"></script>
</body>
</html>
